name: CI

on:
  push:
    branches: ["main", "melhorias-saas-piloto", "produto-comercial-restaurantes", "codex/prontidao-operacional"]
  pull_request:
    branches: ["main", "produto-comercial-restaurantes"]

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      JWT_SECRET: test-jwt-secret
      APP_ENV: test
      CORS_ORIGINS: http://localhost:4173
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile main.py backend/main.py backend/app/core/config.py backend/app/core/database.py backend/app/core/security.py

      - name: Run tests
        run: python -m pytest -q

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: JavaScript syntax check
        shell: bash
        run: |
          find frontend -type f -name '*.js' -print0 |
            xargs -0 -n1 node --check

      - name: Install browser tests
        run: npm ci && npx playwright install --with-deps chromium

      - name: Test local screens and required password change
        env:
          E2E_LOCAL: "1"
        run: npx playwright test e2e/readiness.spec.js --workers=1

      - name: Keep browser test evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
